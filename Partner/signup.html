
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join as Partner | ViralDil</title>
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    body { min-height:100vh; padding:25px 15px; }
    .partner-form { max-width:520px; margin:30px auto; }
    .partner-form h1 { font-size:30px; margin-bottom:8px; }
    .partner-form input:not([type="checkbox"]),
    .partner-form select {
      width:100%; padding:13px; border-radius:11px;
      background:#0c0c17; color:white;
      border:1px solid #302b48;
    }
    .partner-form button { width:100%; margin-top:18px; }
    .notice { color:#c4a4ff; font-size:13px; line-height:1.5; }
    .back { display:block; text-align:center; margin-top:18px; }
  </style>
</head>
<body>

  <div class="form partner-form">
    <a class="brand" href="../index.html">Viral<span>Dil</span></a>

    <p class="eyebrow">Creator Partnership</p>
    <h1>Join as a Partner</h1>
    <p class="muted">
      Create your account and submit your partner application.
    </p>

    <form id="partnerSignup">

      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" type="text" maxlength="100"
          placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" type="email" maxlength="254"
          placeholder="Enter your email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters" required>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <input id="country" type="text" maxlength="100"
          placeholder="Your country" required>
      </div>

      <div class="field">
        <label for="channel">Website or Social Profile</label>
        <input id="channel" type="url" maxlength="500"
          placeholder="https://example.com">
      </div>

      <div class="field">
        <label for="content">Content Category</label>
        <select id="content" required>
          <option value="">Select category</option>
          <option>Entertainment</option>
          <option>Emotional Stories</option>
          <option>Romance</option>
          <option>Comedy</option>
          <option>AI Generated Videos</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>
          <input type="checkbox" id="rights"
            style="width:auto" required>
          I confirm that I own or have permission to upload,
          edit, store, distribute and monetize the videos I submit.
        </label>
      </div>

      <p class="notice">
        Applications require Admin review. Approval is not guaranteed.
        You must have the necessary rights for all submitted content.
      </p>

      <button type="submit" id="submitButton">
        Create Account & Submit Application
      </button>

      <p id="message" class="notice" aria-live="polite"></p>
    </form>

    <a class="back muted" href="../index.html">Back to ViralDil</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCX7XIJTMLMBqZjwh5stVxDOmc1Xo-d2g0",
      authDomain: "viraldil.firebaseapp.com",
      projectId: "viraldil",
      storageBucket: "viraldil.firebasestorage.app",
      messagingSenderId: "545020674224",
      appId: "1:545020674224:web:95de7739790d3c23f4bb75"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const form = document.getElementById("partnerSignup");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      submitButton.textContent = "Creating account...";
      message.textContent = "";

      let accountCreated = false;

      try {
        const fullName = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const country = document.getElementById("country").value.trim();
        const socialProfile = document.getElementById("channel").value.trim();
        const contentCategory = document.getElementById("content").value;
        const rightsConfirmed = document.getElementById("rights").checked;

        const credential = await auth.createUserWithEmailAndPassword(
          email,
          password
        );

        accountCreated = true;

        await credential.user.updateProfile({
          displayName: fullName
        });

        const idToken = await credential.user.getIdToken(true);

        submitButton.textContent = "Submitting application...";

        const response = await fetch("/api/partner/applications", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + idToken
          },
          body: JSON.stringify({
            fullName,
            email,
            country,
            socialProfile,
            contentCategory,
            rightsConfirmed
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "Application could not be submitted.");
        }

        message.textContent =
          "Account created. Application submitted successfully. Status: Pending Admin review.";

        form.reset();
        document.getElementById("password").value = "";

      } catch (error) {
        if (accountCreated) {
          message.textContent =
            "Your Firebase account was created, but application submission failed. Please sign in and contact support.";
        } else {
          const errors = {
            "auth/email-already-in-use": "This email already has an account. Please sign in.",
            "auth/weak-password": "Please use a stronger password.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/network-request-failed": "Network error. Please try again."
          };

          message.textContent =
            errors[error.code] || error.message || "Unable to create account.";
        }
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create Account & Submit Application";
      }
    });
  </script>

</body>
</html>
