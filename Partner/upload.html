
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Video - ViralDil</title>
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101018;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .upload-container {
      max-width: 650px;
      margin: 25px auto;
      padding: 16px;
    }

    .upload-card {
      background: #191925;
      border: 1px solid #303044;
      border-radius: 14px;
      padding: 20px;
    }

    h2 { color: #ff477e; }

    label {
      display: block;
      margin-top: 16px;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      background: #101018;
      color: #fff;
      border: 1px solid #414158;
      border-radius: 8px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .rights {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
      margin: 18px 0;
      font-size: 13px;
    }

    .rights input {
      width: auto;
      margin-top: 3px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #ff477e;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    .notice {
      background: #252235;
      padding: 13px;
      border-radius: 8px;
      color: #ddd;
      font-size: 13px;
      line-height: 1.6;
      margin: 15px 0;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #ff77a0;
    }
  </style>
</head>

<body>
  <main class="upload-container">
    <div class="upload-card">
      <h2>Upload Video</h2>
      <p>Submit your video details for ViralDil Admin review.</p>

      <div class="notice">
        <strong>Important:</strong>
        Actual video file storage is not available yet.
        This form currently submits video information only.
      </div>

      <form id="uploadForm">

        <label for="title">Video Title</label>
        <input
          type="text"
          id="title"
          maxlength="150"
          required
          placeholder="Enter video title"
        >

        <label for="description">Video Description</label>
        <textarea
          id="description"
          maxlength="2000"
          placeholder="Describe your video"
        ></textarea>

        <label for="category">Video Category</label>
        <select id="category" required>
          <option value="">Select Category</option>
          <option value="Emotional">Emotional</option>
          <option value="Romance">Romance</option>
          <option value="Funny">Funny</option>
          <option value="AI Stories">AI Stories</option>
          <option value="Trending">Trending</option>
          <option value="Entertainment">Entertainment</option>
        </select>

        <label for="duration">Video Duration (Seconds)</label>
        <input
          type="number"
          id="duration"
          min="1"
          max="600"
          step="1"
          required
          placeholder="Maximum 600 seconds"
        >

        <label class="rights">
          <input type="checkbox" id="rights" required>
          <span>
            I confirm that I own this video or have permission
            to upload, edit, distribute and monetize it.
          </span>
        </label>

        <button type="submit" id="submitBtn">
          Submit for Admin Review
        </button>

        <div id="message" role="status"></div>
      </form>

      <a class="back-link" href="dashboard.html">
        ← Back to Partner Dashboard
      </a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyCX7XIJTMLMBqZjwh5stVxDOmc1Xo-d2g0",
  authDomain: "viraldil.firebaseapp.com",
      projectId: "viraldil",
      storageBucket: "viraldil.firebasestorage.app",
      messagingSenderId: "545020674224",
      appId: "1:545020674224:web:95de7739790d3c23f4bb75",
      measurementId: "G-2GQKHJW7EV"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const form = document.getElementById("uploadForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    let currentUser = null;

    auth.onAuthStateChanged(user => {
      currentUser = user;

      if (!user) {
        window.location.href = "login.html";
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser) {
        message.textContent = "Please sign in again.";
        return;
      }

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const category = document.getElementById("category").value;
      const durationSeconds = Number(
        document.getElementById("duration").value
      );
      const rightsConfirmed =
        document.getElementById("rights").checked;

      if (
        title.length < 2 ||
        title.length > 150 ||
        description.length > 2000 ||
        !Number.isInteger(durationSeconds) ||
        durationSeconds < 1 ||
        durationSeconds > 600 ||
        !rightsConfirmed
      ) {
        message.textContent = "Please check all video details.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      message.textContent = "";

      try {
        const token = await currentUser.getIdToken();

        const response = await fetch("/api/partner/videos", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            title,
            description,
            category,
            durationSeconds,
            rightsConfirmed
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Video submission failed.");
        }

        message.textContent =
          "Video details submitted successfully. Status: " +
          data.status;

        form.reset();

      } catch (error) {
        message.textContent = error.message ||
          "Unable to submit video details.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit for Admin Review";
      }
    });
  </script>
</body>
</html>
