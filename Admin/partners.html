
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partner Applications | ViralDil</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .admin-wrap { max-width:1100px; margin:35px auto; padding:18px; }
    .application {
      background:#171727; border:1px solid #302b48;
      border-radius:15px; padding:18px; margin:14px 0;
    }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }
    .reject { background:#8d304b; }
    .suspend { background:#76552a; }
    .status { color:#c4a4ff; font-size:13px; }
    .error { color:#ff9aaf; }
    .details { color:#c4bdd2; font-size:14px; line-height:1.7; }
  </style>
</head>
<body>
  <main class="admin-wrap">
    <a class="brand" href="dashboard.html">Viral<span>Dil</span></a>

    <h1>Partner Applications</h1>
    <p class="muted">Review and manage partner applications.</p>

    <div class="panel">
      <div class="head">
        <h2>Applications</h2>
        <button type="button" id="refresh" class="secondary">Refresh</button>
      </div>
      <p id="message" class="status" aria-live="polite">
        Loading applications...
      </p>
      <div id="applications"></div>
    </div>
  </main>

  <script>
    (() => {
      const list = document.getElementById("applications");
      const message = document.getElementById("message");
      const refreshButton = document.getElementById("refresh");

      const loginUrl = "/Admin/login.html";

      function getToken() {
        return sessionStorage.getItem("viraldil_admin_token");
      }

      function requireToken() {
        const token = getToken();

        if (!token) {
          window.location.replace(loginUrl);
          return null;
        }

        return token;
      }

      async function apiRequest(url, options = {}) {
        const token = requireToken();
        if (!token) throw new Error("Admin login required");

        const headers = new Headers(options.headers || {});
        headers.set("Authorization", "Bearer " + token);
        headers.set("Accept", "application/json");

        const response = await fetch(url, {
          ...options,
          headers,
          cache: "no-store"
        });

        if (response.status === 401 || response.status === 403) {
          sessionStorage.removeItem("viraldil_admin_token");
          window.location.replace(loginUrl);
          throw new Error("Admin session expired. Please login again.");
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        return data;
      }

      function addText(parent, tag, text, className = "") {
        const element = document.createElement(tag);
        element.textContent = text;
        if (className) element.className = className;
        parent.appendChild(element);
        return element;
      }

      async function loadApplications() {
        list.replaceChildren();
        message.textContent = "Loading applications...";
        message.className = "status";
        refreshButton.disabled = true;

        try {
          const data = await apiRequest("/api/admin/partners", {
            method: "GET"
          });

          const partners = Array.isArray(data.partners)
            ? data.partners
            : [];

          if (!partners.length) {
            message.textContent = "No partner applications found.";
            return;
          }

          message.textContent = "";

          partners.forEach(partner => {
            const card = document.createElement("section");
            card.className = "application";

            addText(card, "h3", partner.full_name || "Unnamed applicant");
            addText(card, "p", "Email: " + (partner.email || "Not provided"), "details");
            addText(card, "p", "Country: " + (partner.country || "Not provided"), "details");
            addText(card, "p", "Category: " + (partner.content_category || "Not provided"), "details");
            addText(card, "p", "Social profile: " + (partner.social_profile || "Not provided"), "details");
            addText(card, "p", "Rights confirmed: " + (partner.rights_confirmed ? "Yes" : "No"), "details");
            addText(card, "p", "Status: " + (partner.status || "Pending"), "status");

            if (partner.created_at) {
              addText(card, "p", "Applied: " + partner.created_at, "details");
            }

            if (partner.id && partner.status !== "Rejected") {
              const actions = document.createElement("div");
              actions.className = "actions";

              let availableStatuses = [];

              if (partner.status === "Pending") {
                availableStatuses = ["Approved", "Rejected"];
              } else if (partner.status === "Approved") {
                availableStatuses = ["Suspended"];
              } else if (partner.status === "Suspended") {
                availableStatuses = ["Approved", "Rejected"];
              }

              availableStatuses.forEach(newStatus => {
                const button = document.createElement("button");
                button.type = "button";

                button.textContent = {
                  Approved: "Approve / Reactivate",
                  Rejected: "Reject",
                  Suspended: "Suspend"
                }[newStatus];

                if (newStatus === "Rejected") button.className = "reject";
                if (newStatus === "Suspended") button.className = "suspend";

                button.addEventListener("click", () =>
                  updateStatus(partner.id, newStatus, button)
                );

                actions.appendChild(button);
              });

              if (actions.children.length) card.appendChild(actions);
            }

            list.appendChild(card);
          });

        } catch (error) {
          message.textContent = error.message;
          message.className = "error";
        } finally {
          refreshButton.disabled = false;
        }
      }

      async function updateStatus(id, status, button) {
        if (!confirm("Change partner status to " + status + "?")) return;

        button.disabled = true;
        message.textContent = "Updating partner status...";

        try {
          await apiRequest(
            "/api/admin/partners/" + encodeURIComponent(id) + "/status",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status })
            }
          );

          await loadApplications();

        } catch (error) {
          message.textContent = error.message;
          message.className = "error";
          button.disabled = false;
        }
      }

      refreshButton.addEventListener("click", loadApplications);

      if (requireToken()) {
        loadApplications();
      }
    })();
  </script>
</body>
</html>
